en:
  site_settings:
    bale_notifications_enabled: Enable Bale notifications?
    bale_access_token: Obtain your bot's access token from the Bale botfather (@botfather)
    bale_enabled_notification_types: Limit notifications sent to Bale by this selection of types
    bale_notifications_show_avatar: Send the notifying user's avatar as a photo alongside the message, when the resulting caption fits Bale's caption length limit
    bale_notifications_quiet_hours_enabled: Deliver messages silently (no sound/vibration) during quiet hours, using the recipient's own timezone when set
    bale_notifications_quiet_hours_start: Quiet hours start (0-23, recipient's local time)
    bale_notifications_quiet_hours_end: Quiet hours end (0-23, recipient's local time)
  discourse_bale_notifications:
    initial-contact: "To get notifications for %{site_title}, open your user preferences on the forum, generate a linking code, and send that code to me here."
    link-success: "✅ Connected! Hi %{username}, I'll message you here when you have new notifications on %{site_title}."
    known-user: |-
     Hi %{username}, I'll message you when you have new notifications on %{site_title}. 
     To reply, use Reply on a notification in Bale and send your text; it will be posted on %{site_title}.
     To disable, visit your user preferences.
    view_online: "View online"
    like: "❤️ Like"
    unlike: "❤️ Unlike"
    already-liked: "You already liked that post"
    like-failed: "Liking that post failed"
    like-success: "Like successful"
    unlike-failed: "Unliking that post failed"
    unlike-success: "Unlike successful"
    action-unavailable: "❌ This action is no longer available (the post may have been deleted or your account link removed)"
    reply-error: "❌ An error occured while processing your reply"
    reply-failed: "❌ Reply failed: \n\n %{errors}"
    reply-success: "✅ Reply posted successfully. [View the reply](%{post_url})"
    # فاز سه - اصلاح #۱۵: پیام‌های سمت سرور پنل مدیریتی.
    admin:
      user_not_found: "No user found with that username."
      user_not_linked: "That user hasn't connected a Bale chat yet."
      test_message: "🧪 This is a test message from %{site_title}. If you received this, your Bale notifications are working correctly."
      test_failed: "Sending the test message failed. Check the site logs for details."
    message:
      mentioned: |-
                💬 [@%{username}](%{user_url}) mentioned you
                in [%{topic}](%{post_url})

                %{post_excerpt}
      group_mentioned: |-
                💬 [@%{username}](%{user_url}) mentioned you
                in [%{topic}](%{post_url})

                %{post_excerpt}
      quoted: |-
                💬 [@%{username}](%{user_url}) quoted you
                in [%{topic}](%{post_url})

                %{post_excerpt}
      replied: |-
                ↩️ [@%{username}](%{user_url}) replied to you
                in [%{topic}](%{post_url})

                %{post_excerpt}
      posted: |-
                💬 [@%{username}](%{user_url}) posted
                in [%{topic}](%{post_url})

                %{post_excerpt}
      private_message: |-
                ✉️ [@%{username}](%{user_url}) sent you a personal message
                Private-message topic: [%{topic}](%{post_url})
                To reply, use Reply on this notification.

                %{post_excerpt}
      linked: |-
                🔗 [@%{username}](%{user_url}) linked to your post
                from [%{topic}](%{post_url})

                %{post_excerpt}
      watching_first_post: |-
                💬 [@%{username}](%{user_url}) posted
                in [%{topic}](%{post_url})

                %{post_excerpt}
      # Discourse Follow Plugin
      following_replied: |-
                ↩️👥 [@%{username}](%{user_url}) replied
                in [%{topic}](%{post_url})

                %{post_excerpt}
      following_posted: |-
                💬👥 [@%{username}](%{user_url}) posted
                in [%{topic}](%{post_url})

                %{post_excerpt}
      # Discourse Calendar plugin - see NOTIFICATION_COVERAGE.md: whether these
      # two ever actually reach this template is unverified in this environment.
      event_reminder: |-
                📅 Reminder: an event in [%{topic}](%{post_url}) is coming up

                %{post_excerpt}
      event_invitation: |-
                🗓️ [@%{username}](%{user_url}) invited you to an event
                in [%{topic}](%{post_url})

                %{post_excerpt}
