en:
  site_settings:
    bale_notifications_enabled: Enable Bale notifications?
    bale_access_token: Obtain your bot's access token from the Bale botfather (@botfather)
    bale_enabled_notification_types: Limit notifications sent to Bale by this selection of types
  discourse_bale_notifications:
    initial-contact: "To get notifications for %{site_title}, open your user preferences on the forum, generate a linking code, and send that code to me here."
    link-success: "✅ Connected! Hi %{username}, I'll message you here when you have new notifications on %{site_title}."
    known-user: |-
     Hi %{username}, I'll message you when you have new notifications on %{site_title}. 
     Replying to a notification will post a reply on %{site_title}.
     To disable, visit your user preferences.
    view_online: "View online"
    like: "❤️ Like"
    unlike: "❤️ Unlike"
    already-liked: "You already liked that post"
    like-failed: "Liking that post failed"
    like-success: "Like successful"
    unlike-failed: "Unliking that post failed"
    unlike-success: "Unlike successful"
    action-unavailable: "❌ This action is no longer available (the post may have been deleted or your account link removed)"
    reply-error: "❌ An error occured while processing your reply"
    reply-failed: "❌ Reply failed: \n\n %{errors}"
    reply-success: "✅ Reply successful - view it <a href='%{post_url}'>here</a>"
    message:
      mentioned: |-
                💬 <a href="%{user_url}">@%{username}</a> <b>mentioned</b> you
                in <a href="%{post_url}">%{topic}</a>

                <pre>%{post_excerpt}</pre>
      group_mentioned: |-
                💬 <a href="%{user_url}">@%{username}</a> <b>mentioned</b> you
                in <a href="%{post_url}">%{topic}</a>

                <pre>%{post_excerpt}</pre>
      quoted: |-
                💬 <a href="%{user_url}">@%{username}</a> <b>quoted</b> you
                in <a href="%{post_url}">%{topic}</a>

                <pre>%{post_excerpt}</pre>
      replied: |-
                ↩️ <a href="%{user_url}">@%{username}</a> <b>replied</b> to you
                in <a href="%{post_url}">%{topic}</a>

                <pre>%{post_excerpt}</pre>
      posted: |-
                💬 <a href="%{user_url}">@%{username}</a> <b>posted</b>
                in <a href="%{post_url}">%{topic}</a>

                <pre>%{post_excerpt}</pre>
      private_message: |-
                ✉️ <a href="%{user_url}">@%{username}</a> sent you a <b>private message</b>
                in <a href="%{post_url}">%{topic}</a>

                <pre>%{post_excerpt}</pre>
      linked: |-
                🔗 <a href="%{user_url}">@%{username}</a> <b>linked</b> to your post
                from <a href="%{post_url}">%{topic}</a>

                <pre>%{post_excerpt}</pre>
      watching_first_post: |-
                💬 <a href="%{user_url}">@%{username}</a> <b>posted</b>
                in <a href="%{post_url}">%{topic}</a>

                <pre>%{post_excerpt}</pre>
      # Discourse Follow Plugin
      following_replied: |-
                ↩️👥 <a href="%{user_url}">@%{username}</a> <b>replied</b>
                in <a href="%{post_url}">%{topic}</a>

                <pre>%{post_excerpt}</pre>
      following_posted: |-
                💬👥 <a href="%{user_url}">@%{username}</a> <b>posted</b>
                in <a href="%{post_url}">%{topic}</a>

                <pre>%{post_excerpt}</pre>
      # Discourse Calendar plugin - see NOTIFICATION_COVERAGE.md: whether these
      # two ever actually reach this template is unverified in this environment.
      event_reminder: |-
                📅 <b>Reminder:</b> an event in <a href="%{post_url}">%{topic}</a> is coming up

                <pre>%{post_excerpt}</pre>
      event_invitation: |-
                🗓️ <a href="%{user_url}">@%{username}</a> <b>invited</b> you to an event
                in <a href="%{post_url}">%{topic}</a>

                <pre>%{post_excerpt}</pre>
