pl_PL:
  site_settings:
    telegram_notifications_enabled: Włączone powiadomienia z telegramu?
    telegram_access_token: Uzyskaj token dostępu do swojego bota
  discourse_telegram_notifications:
    initial-contact: "Aby otrzymywać powiadomienia %{site_title}, wprowadź 'Chat ID' %{chat_id} w preferencjach użytkownika."
    known-user: |-
     Witaj %{username}, wyślemy ci wiadomość o nowych powiadomieniach na %{site_title}.
     Odpowiadając na powiadomienie opublikuję odpowiedź na %{site_title}.
     Aby wyłączyć, odwiedź ustawienia użytkownika.
    view_online: "Zobacz online"
    like: "Lajkuj"
    unlike: "Wycofaj lajka"
    already-liked: "Właśnie zalajkowałeś ten post"
    like-failed: "Nie udało się zalajkować"
    like-success: "Pomyślnie zalajkowano wpis"
    unlike-failed: "Nie udało się zaprzestać lajkować ;)"
    unlike-success: "Pomyślnie wycofano lajka"
    reply-error: "❌ Błąd podczas przetwarzania odpowiedzi."
    reply-failed: "❌ Odpowiedź nie powiodła się: \n\n %{errors}"
    reply-success: "✅ Pomyślnie odpowiedziano - wyświetl to [here](%{post_url})"
    message:
      mentioned: |-
                💬 [@%{username}](%{user_url}) wspomina o Tobie w  
                [%{topic}](%{post_url})

                %{post_excerpt}
      group_mentioned: |-
                💬 [@%{username}](%{user_url}) wspomina o Tobie w  [%{topic}](%{post_url})

                %{post_excerpt}
      quoted: |-
                💬 [@%{username}](%{user_url}) cytuje Ciebie w [%{topic}](%{post_url})

                %{post_excerpt}
      replied: |-
                ↩️ [@%{username}](%{user_url}) odpowiada tobie w [%{topic}](%{post_url})

                %{post_excerpt}
      posted: |-
                💬 [@%{username}](%{user_url}) napisał
                w [%{topic}](%{post_url})

                %{post_excerpt}
      private_message: |-
                ✉️ [@%{username}](%{user_url}) wysłał Tobie prywatną wiadomość
                in [%{topic}](%{post_url})

                %{post_excerpt}
      linked: |-
                🔗 [@%{username}](%{user_url}) wysłał odnośnik do Twojego postu z [%{topic}](%{post_url})

                %{post_excerpt}
      following_replied: |-
                ↩️ Obserwowany [@%{username}](%{user_url}) odpowiedział w [%{topic}](%{post_url})

                %{post_excerpt}
      following_posted: |-
                ↩️ Obserwowany [@%{username}](%{user_url}) utworzył nowy temat: [%{topic}](%{post_url})

                %{post_excerpt}
