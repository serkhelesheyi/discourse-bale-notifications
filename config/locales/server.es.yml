es:
  site_settings:
    telegram_notifications_enabled: ¿Activar notificaciones de Telegram?
    telegram_access_token: Obtén el token de acceso del botfather de Telegram
  discourse_telegram_notifications:
    initial-contact: "Para recibir notificaciones de %{site_title}, introduce el siguiente código: %{chat_id} en tus preferencias de la comunidad"
    known-user: |-
     ¡Hola %{username}! Soy el bot de %{site_title}, te enviaré mensajes cuando tengas nuevas notificaciones.
     Puedes responder directamente desde esta ventana. Simplemente al contestar a una notificación aquí, se publicará automáticamente en %{site_title}.
     Puedes desativar notificaciones desde las preferencias de tu usuario en %{site_title}.
    view_online: "Ver en la web"
    like: "❤️ Me gusta"
    unlike: "❤️ No me gusta"
    already-liked: "Ya habías marcado que te gusta"
    like-failed: "Fallo al hacer me gusta"
    like-success: "¡Bien!"
    unlike-failed: "Fallo al quitar el me gusta"
    unlike-success: "Quitaste el me gusta de forma correcta"
    reply-error: "❌ Ocurrió un error al enviar tu respuesta"
    reply-failed: "❌ Fallo al responder: \n\n %{errors}"
    reply-success: "✅ Respuesta enviada correctamente, [puedes verla aquí](%{post_url})"
    message:
      mentioned: |-
                💬 [@%{username}](%{user_url}) te ha mencionado
                en [%{topic}](%{post_url})

                %{post_excerpt}
      group_mentioned: |-
                💬 [@%{username}](%{user_url}) te ha mencionado
                en [%{topic}](%{post_url})

                %{post_excerpt}
      quoted: |-
                💬 [@%{username}](%{user_url}) te ha citado
                en [%{topic}](%{post_url})

                %{post_excerpt}
      replied: |-
                ↩️ [@%{username}](%{user_url}) te ha contestado
                en [%{topic}](%{post_url})

                %{post_excerpt}
      posted: |-
                💬 [@%{username}](%{user_url}) ha publicado
                en [%{topic}](%{post_url})

                %{post_excerpt}
      private_message: |-
                ✉️ [@%{username}](%{user_url}) te ha enviado un mensaje privado
                en [%{topic}](%{post_url})

                %{post_excerpt}
      linked: |-
                🔗 [@%{username}](%{user_url}) ha enlazado tu hilo
                desde [%{topic}](%{post_url})

                %{post_excerpt}
      
      watching_first_post: |-
                💬 [@%{username}](%{user_url}) ha publicado
                en [%{topic}](%{post_url})

                %{post_excerpt}
      # Discourse Follow Plugin
      following_replied: |-
                ↩️👥 [@%{username}](%{user_url}) ha respondido
                en [%{topic}](%{post_url})

                %{post_excerpt}
      following_posted: |-
                💬👥 [@%{username}](%{user_url}) publicó
                en [%{topic}](%{post_url})

                %{post_excerpt}
