it:
  site_settings:
    telegram_notifications_enabled: Abilitare le notifiche da telegram?
    telegram_access_token: Ottieni il token per l'accesso del tuo bot da botfather di telegram
  discourse_telegram_notifications:
    initial-contact: "Per ricevere notifiche da %{site_title}, inserisci lo 'Chat ID' %{chat_id} nelle tue preferenze utente"
    known-user: |-
     Ciao %{username}, ti invierò un messaggio quando riceverai nuove notifiche da %{site_title}. 
     Rispondere a una notifica pubblicherà una risposta anche su %{site_title}.
     Per disabilitare le notifiche, visita le tue preferenze utente.
    view_online: " Visualizza in linea"
    like: "❤️ Mi piace"
    unlike: "❤️ Rimuovi mi piace"
    already-liked: "Hai già messo mi piace a questo messaggio"
    like-failed: "Fallimento nel mettere mi piace"
    like-success: "Messo mi piace con successo"
    unlike-failed: "Fallimento nel rimuovere mi piace"
    unlike-success: "Rimosso mi piace con successo"
    reply-error: "❌ Si è verificato un errore durante l'elaborazione della risposta"
    reply-failed: "❌ Risposta fallita: \n\n %{errors}"
    reply-success: "✅ Risposta inviata con successo - visualizzala [qui](%{post_url})"
    message:
      mentioned: |-
                💬 [@%{username}](%{user_url}) ti ha menzionato
                in [%{topic}](%{post_url})

                %{post_excerpt}
      group_mentioned: |-
                💬 [@%{username}](%{user_url}) ti ha menzionato
                in [%{topic}](%{post_url})

                %{post_excerpt}
      quoted: |-
                💬 [@%{username}](%{user_url}) ti ha citato
                in [%{topic}](%{post_url})

                %{post_excerpt}
      replied: |-
                ↩️ [@%{username}](%{user_url}) ti ha risposto
                in [%{topic}](%{post_url})

                %{post_excerpt}
      posted: |-
                💬 [@%{username}](%{user_url}) ha postato
                in [%{topic}](%{post_url})

                %{post_excerpt}
      private_message: |-
                ✉️ [@%{username}](%{user_url}) ti ha inviato un messaggio privato
                in [%{topic}](%{post_url})

                %{post_excerpt}
      linked: |-
                🔗 [@%{username}](%{user_url}) ha creato un collegamento al tuo messaggio
                da [%{topic}](%{post_url})

                %{post_excerpt}
      watching_first_post: |-
                💬 [@%{username}](%{user_url}) ha postato
                in [%{topic}](%{post_url})

                %{post_excerpt}
      # Discourse Follow Plugin
      following_replied: |-
                ↩️👥 [@%{username}](%{user_url}) ha risposto
                in [%{topic}](%{post_url})

                %{post_excerpt}
      following_posted: |-
                💬👥 [@%{username}](%{user_url}) ha postato
                in [%{topic}](%{post_url})

                %{post_excerpt}
