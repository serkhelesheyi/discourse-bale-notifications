fa_IR:
  site_settings:
    bale_notifications_enabled: "فعال‌سازی اعلان‌های بله؟"
    bale_access_token: "توکن دسترسی ربات خود را از BotFather بله (@botfather) دریافت کنید"
    bale_enabled_notification_types: "نوع اعلان‌هایی که به بله ارسال می‌شوند را با این انتخاب محدود کنید"
    bale_notifications_show_avatar: "آواتار کاربر عامل اعلان را به‌همراه پیام به‌صورت عکس ارسال کن (فقط وقتی متن پیام در محدودیت طول کپشن بله جا شود)"
    bale_notifications_quiet_hours_enabled: "پیام‌ها در ساعات سکوت به‌صورت بی‌صدا (بدون صدا/لرزش) تحویل داده شوند - بر اساس منطقه‌ی زمانی خودِ کاربر (در صورت تنظیم‌بودن)"
    bale_notifications_quiet_hours_start: "شروع ساعات سکوت (۰ تا ۲۳، به وقت محلی کاربر)"
    bale_notifications_quiet_hours_end: "پایان ساعات سکوت (۰ تا ۲۳، به وقت محلی کاربر)"
  discourse_bale_notifications:
    initial-contact: "برای دریافت اعلان‌های «%{site_title}»، به تنظیمات کاربری خود در انجمن بروید، یک «کد اتصال» بسازید، و همان کد را اینجا برای من ارسال کنید."
    link-success: "✅ اتصال برقرار شد! سلام %{username}، از این پس هر زمان اعلان جدیدی در «%{site_title}» داشته باشید، اینجا به شما پیام خواهم داد."
    known-user: |-
     سلام %{username}، هر زمان اعلان جدیدی در «%{site_title}» داشته باشید به شما پیام خواهم داد.
     برای پاسخ‌دادن، روی پیام اعلان در بله Reply بزنید و متن پاسخ را ارسال کنید؛ پاسخ در «%{site_title}» ثبت می‌شود.
     برای غیرفعال‌سازی، به تنظیمات کاربری خود در انجمن بروید.
    view_online: "مشاهده آنلاین"
    like: "❤️ پسندیدن"
    unlike: "❤️ لغو پسندیدن"
    already-liked: "شما قبلاً این پست را پسندیده‌اید"
    like-failed: "پسندیدن این پست ناموفق بود"
    like-success: "پسند ثبت شد"
    unlike-failed: "لغو پسند این پست با خطا مواجه شد"
    unlike-success: "لغو پسند انجام شد"
    action-unavailable: "❌ این عملیات دیگر در دسترس نیست (ممکن است پست حذف شده یا اتصال حساب شما قطع شده باشد)"
    reply-error: "❌ خطایی هنگام پردازش پاسخ رخ داد"
    reply-failed: "❌ ارسال پاسخ ناموفق بود: \n\n %{errors}"
    reply-success: "✅ پاسخ با موفقیت ثبت شد. [مشاهدهٔ پاسخ](%{post_url})"
    # فاز سه - اصلاح #۱۵: پیام‌های سمت سرور پنل مدیریتی.
    admin:
      user_not_found: "کاربری با این نام کاربری پیدا نشد."
      user_not_linked: "این کاربر هنوز چت بله‌ای متصل نکرده است."
      test_message: "🧪 این یک پیام آزمایشی از «%{site_title}» است. اگر آن را دریافت کردید، اعلان‌های بله شما به‌درستی کار می‌کنند."
      test_failed: "ارسال پیام آزمایشی ناموفق بود. برای جزئیات، لاگ سرور را بررسی کنید."
    message:
      mentioned: |-
                💬 [@%{username}](%{user_url}) شما را منشن کرد
                در [%{topic}](%{post_url})

                %{post_excerpt}
      group_mentioned: |-
                💬 [@%{username}](%{user_url}) شما را منشن کرد
                در [%{topic}](%{post_url})

                %{post_excerpt}
      quoted: |-
                💬 [@%{username}](%{user_url}) از شما نقل‌قول کرد
                در [%{topic}](%{post_url})

                %{post_excerpt}
      replied: |-
                ↩️ [@%{username}](%{user_url}) به شما پاسخ داد
                در [%{topic}](%{post_url})

                %{post_excerpt}
      posted: |-
                💬 [@%{username}](%{user_url}) مطلبی منتشر کرد
                در [%{topic}](%{post_url})

                %{post_excerpt}
      private_message: |-
                ✉️ [@%{username}](%{user_url}) برای شما یک پیام خصوصی فرستاد
                موضوع پیام خصوصی: [%{topic}](%{post_url})

                %{post_excerpt}
      linked: |-
                🔗 [@%{username}](%{user_url}) به پست شما لینک داد
                در [%{topic}](%{post_url})

                %{post_excerpt}
      watching_first_post: |-
                💬 [@%{username}](%{user_url}) پستی ارسال کرد
                در [%{topic}](%{post_url})

                %{post_excerpt}
      following_replied: |-
                ↩️👥 [@%{username}](%{user_url}) پاسخ داد
                در [%{topic}](%{post_url})

                %{post_excerpt}
      following_posted: |-
                💬👥 [@%{username}](%{user_url}) پستی ارسال کرد
                در [%{topic}](%{post_url})

                %{post_excerpt}
      # افزونه Discourse Calendar - طبق NOTIFICATION_COVERAGE.md، مشخص نیست این دو
      # نوع در این محیط واقعاً به این تمپلیت می‌رسند یا خیر؛ نیاز به تست عملی دارد.
      event_reminder: |-
                📅 یادآوری: رویدادی در [%{topic}](%{post_url}) نزدیک است

                %{post_excerpt}
      event_invitation: |-
                🗓️ [@%{username}](%{user_url}) شما را به یک رویداد دعوت کرد
                در [%{topic}](%{post_url})

                %{post_excerpt}

