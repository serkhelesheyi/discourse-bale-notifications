zh_HK:
  site_settings:
    telegram_notifications_enabled: 啓用 Telegram 通知？
    telegram_access_token: 使用 Telegram 的 BotFather 獲得你的 Bot Access Token
  discourse_telegram_notifications:
    initial-contact: "如要獲得來自 %{site_title} 的通知，請先在你的用戶偏好中輸入 'Chat ID' %{chat_id}"
    known-user: |-
     你好 %{username}，每當你有新通知時，我會發送訊息給你。
     回覆此通知會在 %{site_title} 發佈回覆。
     如要停用此功能，請在你的用戶偏好中設定。
    view_online: "線上檢視"
    like: "❤️ 讚好"
    unlike: "❤️ 取消讚好"
    already-liked: "你已經讚好了該帖"
    like-failed: "讚好不成功"
    like-success: "成功讚好"
    unlike-failed: "取消讚好不成功"
    unlike-success: "成功取消讚好"
    reply-error: "❌ 處理你的回覆時發生錯誤"
    reply-failed: "❌ 回覆不成功：\n\n %{errors}"
    reply-success: "✅ 成功回覆，可以瀏覽：[here](%{post_url})"
    message:
      mentioned: |-
                💬 在 [%{topic}](%{post_url})
                [@%{username}](%{user_url}) 提及了你

                %{post_excerpt}
      group_mentioned: |-
                💬 在 [%{topic}](%{post_url})
                [@%{username}](%{user_url}) 提及了你

                %{post_excerpt}
      quoted: |-
                💬 在 [%{topic}](%{post_url}) 
                [@%{username}](%{user_url}) 引用了你

                %{post_excerpt}
      replied: |-
                ↩️ 在 [%{topic}](%{post_url}) 
                [@%{username}](%{user_url}) 回覆了你

                %{post_excerpt}
      posted: |-
                💬 [@%{username}](%{user_url}) 發佈了
                [%{topic}](%{post_url})

                %{post_excerpt}
      private_message: |-
                ✉️ 在 [%{topic}](%{post_url})
                [@%{username}](%{user_url}) 發送了私人訊息給你

                %{post_excerpt}
      linked: |-
                🔗 在 [%{topic}](%{post_url})
                [@%{username}](%{user_url}) 鏈接了你的帖子

                %{post_excerpt}
      watching_first_post: |-
                💬 [@%{username}](%{user_url}) 發佈了
                [%{topic}](%{post_url})

                %{post_excerpt}
      # Discourse Follow Plugin
      following_replied: |-
                ↩️👥 在 [%{topic}](%{post_url})
                [@%{username}](%{user_url}) 有新回覆
                
                %{post_excerpt}
      following_posted: |-
                💬👥 [@%{username}](%{user_url}) 發佈了
                [%{topic}](%{post_url})

                %{post_excerpt}
