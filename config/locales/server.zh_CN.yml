zh_CN:
  site_settings:
    telegram_notifications_enabled: 启用 telegram 通知?
    telegram_access_token: 从 Telegram 官方机器人 BotFather 得到的你自己的机器人的 Token，看起来像 110201543:AAHdqTcvCH1vGWJxfSeofSAs0K5PALDsaw
  discourse_telegram_notifications:
    initial-contact: "要在 %{site_title} 启用通知，请进入论坛的偏好设置 > 个人资料，输入 'Chat ID'：%{chat_id}"
    known-user: |-
     Hi %{username}, 当你在 %{site_title} 上有新的通知时，我会给你留言。
     你可以直接回复通知，就可以在 %{site_title} 上发布回复。
     要禁用通知，请访问你的偏好设置。
    view_online: "在线查看"
    like: "❤️ 点赞"
    unlike: "❤️ 取消点赞"
    already-liked: "你已经赞过这个帖子"
    like-failed: "点赞失败"
    like-success: "点赞成功"
    unlike-failed: "取消点赞失败"
    unlike-success: "取消点赞成功"
    reply-error: "❌ 在处理你的回复时发生了一个错误"
    reply-failed: "❌ 回复失败: \n\n %{errors}"
    reply-success: "✅ 回复成功 - [在线查看](%{post_url})"
    message:
      mentioned: |-
                💬 [@%{username}](%{user_url}) 提及 你
                在 [%{topic}](%{post_url})
                %{post_excerpt}
      group_mentioned: |-
                💬 [@%{username}](%{user_url}) 提及 你
                在 [%{topic}](%{post_url})
                %{post_excerpt}
      quoted: |-
                💬 [@%{username}](%{user_url}) 引用 你
                在 [%{topic}](%{post_url})
                %{post_excerpt}
      replied: |-
                ↩️ [@%{username}](%{user_url}) 回复 给你
                在 [%{topic}](%{post_url})
                %{post_excerpt}
      posted: |-
                💬 [@%{username}](%{user_url}) 发布
                在 [%{topic}](%{post_url})
                %{post_excerpt}
      private_message: |-
                ✉️ [@%{username}](%{user_url}) 发给你 一条私信
                在 [%{topic}](%{post_url})
                %{post_excerpt}
      linked: |-
                🔗 [@%{username}](%{user_url}) 链接 你的帖子
                从 [%{topic}](%{post_url})
                %{post_excerpt}
